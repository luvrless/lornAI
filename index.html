<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lornAI</title>
    <link rel="icon" type="image/png" href="lornAI.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', 'Times New Roman', serif;
        }

        body {
            background: #000000;
            background-image: 
                radial-gradient(#2a2a2a 1px, transparent 1px),
                radial-gradient(#2a2a2a 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            animation: fadeInPage 1.2s ease-out forwards;
            color: #e0e0e0;
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(42, 42, 42, 0.3) 2px,
                rgba(42, 42, 42, 0.3) 4px
            );
            pointer-events: none;
            animation: scanlines 8s linear infinite;
        }

        @keyframes fadeInPage { to { opacity: 1; } }
        @keyframes slideInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 4px; }
        }

        .subtext {
            font-size: 1.1rem;
            color: rgba(170, 170, 170, 0.8);
            margin-bottom: 40px;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
            animation: slideInUp 0.8s ease-out 0.8s forwards;
            opacity: 0;
            font-style: italic;
            border-left: 2px solid #555;
            padding-left: 20px;
            margin-left: 20px;
        }

        .subtext::before { content: "» "; color: #666; }
        .subtext::after {
            content: "_";
            animation: blink 1s infinite;
            color: #666;
        }

        .archive-note {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            color: rgba(102, 102, 102, 0.6);
            text-align: center;
            width: 100%;
            animation: slideInUp 0.8s ease-out 1.2s forwards;
            opacity: 0;
        }

        .archive-note::before { content: "[ "; }
        .archive-note::after { content: " ]"; }

        /* Mobile readability adjustments */
        @media (max-width: 600px) {
            .subtext {
                font-size: 1.15rem;
                padding-left: 14px;
                margin-left: 0;
                margin-right: 0;
                max-width: 90vw;
            }
            .archive-note {
                font-size: 0.85rem;
                bottom: 24px;
            }
        }

        /* CRT effects */
        body.crt::after {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            opacity: 0.15;
            z-index: 999;
            pointer-events: none;
        }

        body.crt::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.9) 100%);
            z-index: 998;
            pointer-events: none;
        }

        body {
            animation: fadeInPage 1.2s ease-out forwards, flicker 5s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.98; }
        }

        .nav-button:hover { animation: glitch 0.3s ease; }

        @keyframes glitch {
            0% { transform: translateY(-2px) translateX(0); }
            20% { transform: translateY(-2px) translateX(-1px); color: #0f0; }
            40% { transform: translateY(-2px) translateX(1px); color: #f0f; }
            60% { transform: translateY(-2px) translateX(-1px); }
            80% { transform: translateY(-2px) translateX(1px); }
            100% { transform: translateY(-2px) translateX(0); color: #fff; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="crt">

    <div class="subtext">lornAI will no longer be available.</div>
    
    <div class="archive-note">ARCHIVED</div>

    <script>
        // === Block right-click and text selection ===
        document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
        document.addEventListener('selectstart', e => { e.preventDefault(); return false; });
        document.addEventListener('dragstart', e => { e.preventDefault(); return false; });

        // === Block common DevTools hotkeys ===
        document.addEventListener('keydown', function(e) {
            const key = e.keyCode || e.which;

            // F12
            if (key === 123) {
                e.preventDefault();
                return false;
            }

            // Ctrl+Shift+I, J, C
            if (e.ctrlKey && e.shiftKey && (key === 73 || key === 74 || key === 67)) {
                e.preventDefault();
                return false;
            }

            // Ctrl+U (view source)
            if (e.ctrlKey && (key === 85 || key === 83)) { // U or S
                e.preventDefault();
                return false;
            }

            // Ctrl+Shift+K (console in some browsers)
            if (e.ctrlKey && e.shiftKey && key === 75) {
                e.preventDefault();
                return false;
            }
        });

        // === DevTools Detection (dimension-based + loop) ===
        let devtoolsOpen = false;
        const threshold = 160; // pixels difference when DevTools is docked

        function detectDevTools() {
            // Mobile browser URL bar / keyboards cause height differences; ignore on touch/mobile
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) return;

            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;

            if (widthDiff > threshold || heightDiff > threshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    triggerProtection();
                }
            } else {
                devtoolsOpen = false;
            }
        }

        function triggerProtection() {
            // Strong reaction when DevTools is detected
            document.body.innerHTML = `
                <div style="color:#f00; font-size:2rem; text-align:center; padding:50px;">
                    ACCESS DENIED<br>
                    <span style="font-size:1rem; color:#888;">Developer Tools detected</span>
                </div>
            `;
            document.body.style.background = '#000';
            
            // Optional: redirect instead
            // window.location.href = "about:blank";
        }

        // Run detection frequently
        setInterval(detectDevTools, 300);

        // Extra console clearing (makes it harder to use console)
        console.clear();
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
        console.info = function() {};

        // Optional: spam debugger statement (very aggressive - can freeze the tab)
        // setInterval(() => { debugger; }, 100);
    </script>

</body>
</html>
