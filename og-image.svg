<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1210"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97757"/>
      <stop offset="100%" style="stop-color:#e8956d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(217,119,87,0.07)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow orb -->
  <ellipse cx="600" cy="280" rx="320" ry="180" fill="rgba(217,119,87,0.08)"/>
  <!-- Logo circle -->
  <circle cx="600" cy="220" r="56" fill="url(#glow)" opacity="0.95"/>
  <text x="600" y="237" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#0d0d0d" text-anchor="middle">L</text>
  <!-- Title -->
  <text x="600" y="330" font-family="system-ui,sans-serif" font-size="72" font-weight="700" fill="#f5f0eb" text-anchor="middle" letter-spacing="-2">lornAI</text>
  <!-- Subtitle -->
  <text x="600" y="390" font-family="system-ui,sans-serif" font-size="28" fill="rgba(245,240,235,0.5)" text-anchor="middle" letter-spacing="6">BY FRAIL</text>
  <!-- Description -->
  <text x="600" y="460" font-family="system-ui,sans-serif" font-size="22" fill="rgba(245,240,235,0.4)" text-anchor="middle">Ask anything. Create anything.</text>
  <!-- URL -->
  <text x="600" y="590" font-family="system-ui,sans-serif" font-size="18" fill="rgba(217,119,87,0.6)" text-anchor="middle">lorn.lol</text>
</svg>
